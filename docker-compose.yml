services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "3000:3000"
    command: npm run start:dev
    depends_on:
      - db
    env_file:
      - .env

  db:
    image: postgres:15
    container_name: medical-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: testeloomi123
      POSTGRES_DB: medical_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: